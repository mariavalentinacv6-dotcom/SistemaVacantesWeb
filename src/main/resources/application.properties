
# Nombre de la aplicacion
spring.application.name=SistemaVacantesWeb

# Configuracion de conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_vacantes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Spring Data JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuracion del servidor web
server.port=8080

# Configuracion de Thymeleaf
spring.thymeleaf.cache=false
